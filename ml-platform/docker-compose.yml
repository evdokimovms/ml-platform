services:

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: adminpassword
    volumes:
      - ./minio-data:/data
    command: server /data --console-address ":9001"


  spark-master:
    image: apache/spark:latest
    container_name: spark-master
    restart: unless-stopped

    ports:
      - "8080:8080"
      - "7077:7077"
      - "9404:9404"

    volumes:
      - ./spark/conf:/opt/spark/conf
      - ./spark/jmx:/opt/spark/jmx

    environment:
      SPARK_DAEMON_JAVA_OPTS: >
        -javaagent:/opt/spark/jmx/jmx_prometheus_javaagent-1.3.0.jar=9404:/opt/spark/conf/jmx.yaml

    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master


  spark-worker:
    image: apache/spark:latest
    container_name: spark-worker

    ports:
      - "8081:8081"
      - "9405:9404"

    volumes:
      - ./spark/conf:/opt/spark/conf
      - ./spark/jmx:/opt/spark/jmx

    environment:
      SPARK_DAEMON_JAVA_OPTS: >
        -javaagent:/opt/spark/jmx/jmx_prometheus_javaagent-1.3.0.jar=9404:/opt/spark/conf/jmx.yaml

      SPARK_WORKER_CORES: 8
      SPARK_WORKER_MEMORY: 16g

    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077







  redis:
    image: redis:latest
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./redis-data:/data
    command: redis-server --appendonly yes


  kafka:
    image: apache/kafka:latest
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - ./kafka-data:/var/lib/kafka/data

  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mlplatform

    ports:
      - "5432:5432"

    volumes:
      - ./postgres-data:/var/lib/postgresql/data

  mlflow:
    build:
      context: ./mlflow

    container_name: mlflow
    restart: unless-stopped

    depends_on:
      - postgres
      - minio

    ports:
      - "5000:5000"

    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: adminpassword
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000

    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://admin:password@postgres:5432/mlplatform
      --default-artifact-root s3://mlflow/

  airflow:
    image: apache/airflow:3.0.0

    container_name: airflow

    restart: unless-stopped

    depends_on:
      - postgres
      - statsd-exporter

    ports:
      - "8085:8080"

    environment:

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN:
        postgresql+psycopg2://admin:password@postgres:5432/airflow

      AIRFLOW__CORE__LOAD_EXAMPLES:
        "false"

      AIRFLOW__METRICS__STATSD_ON: "true"
      AIRFLOW__METRICS__STATSD_HOST: statsd-exporter
      AIRFLOW__METRICS__STATSD_PORT: 8125
      AIRFLOW__METRICS__STATSD_PREFIX: airflow

    volumes:
      - ./dags:/opt/airflow/dags
      - ./airflow-data:/opt/airflow

    command: airflow standalone

  prometheus:
    image: prom/prometheus:v3.5.0

    container_name: prometheus

    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml


  grafana:
    image: grafana/grafana:12.1.0

    container_name: grafana

    restart: unless-stopped

    depends_on:
      - prometheus

    ports:
      - "3000:3000"

    volumes:
      - ./grafana:/var/lib/grafana

  spark-history-server:
    image: apache/spark:latest
    container_name: spark-history-server
    restart: unless-stopped
    depends_on:
      - minio
    ports:
      - "18080:18080"

    volumes:
      - ./spark/jars:/opt/spark/jars

    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: adminpassword

    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.history.HistoryServer




  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    ports:
      - "8082:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://admin:password@postgres:5432/postgres?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      - postgres

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "9121:9121"
    depends_on:
      - redis

  dcgm-exporter:
    image: nvidia/dcgm-exporter:latest
    container_name: dcgm-exporter
    restart: unless-stopped
    ports:
      - "9400:9400"
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
    cap_add:
      - SYS_ADMIN

  statsd-exporter:
    image: prom/statsd-exporter:latest
    container_name: statsd-exporter
    restart: unless-stopped
    ports:
      - "9102:9102"
      - "8125:8125/udp"

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: kafka-exporter
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "9308:9308"
    command:
      - "--kafka.server=kafka:9092"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_data:/qdrant/storage
